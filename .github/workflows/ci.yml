name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NODE_ENV: test
        run: npm test -- --coverage --watchAll=false --silent

      - name: Test development server startup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          timeout 30s npm run dev &
          DEV_PID=$!
          sleep 15
          # Check if process is still running
          if kill -0 $DEV_PID 2>/dev/null; then
            echo "✅ Development server started successfully"
            kill $DEV_PID
          else
            echo "❌ Development server failed to start"
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Comment coverage report
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          delete-old-comments: true

      - name: Check coverage thresholds
        run: |
          node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const total = coverage.total;
            
            console.log('📊 テストカバレッジ結果:');
            console.log('- Statements:', total.statements.pct + '%');
            console.log('- Branches:', total.branches.pct + '%');
            console.log('- Functions:', total.functions.pct + '%');
            console.log('- Lines:', total.lines.pct + '%');
            
            // 最低限のカバレッジ閾値
            const minCoverage = 80;
            
            if (total.statements.pct < minCoverage || 
                total.branches.pct < minCoverage || 
                total.functions.pct < minCoverage || 
                total.lines.pct < minCoverage) {
              console.log('❌ カバレッジが閾値(' + minCoverage + '%)を下回っています');
              process.exit(1);
            } else {
              console.log('✅ カバレッジ要件を満たしています');
            }
          "

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    permissions:
      contents: read
      pull-requests: write
    name: E2E Tests (Chrome)

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Setup E2E test files
        env:
          CI: true
        run: |
          # E2Eテストに必要なファイルをセットアップ（CI環境ではシードデータ用音声ファイルも生成）
          npx tsx scripts/setup-e2e-files.ts
          
          echo "✅ E2E test files setup completed"
          
          # Verify fixtures
          echo "📁 E2E fixtures:"
          ls -la e2e/fixtures/ || echo "No fixtures directory yet"
          
          # Verify uploads
          echo "📁 Uploads directory:"
          ls -la public/uploads/ || echo "No uploads directory yet"

      - name: Run E2E tests - Chrome
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CI: true
          PLAYWRIGHT_HTML_REPORT: playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
        run: |
          echo "🚀 E2Eテスト開始: $(date)"
          echo "📊 環境情報:"
          echo "  - Node.js: $(node --version)"
          echo "  - npm: $(npm --version)"
          echo "  - Workers: 1 (CI mode)"
          echo "  - Retries: 3"
          echo "  - Timeout: 3分"
          
          npm run e2e:ci || {
            echo "❌ E2Eテスト失敗: $(date)"
            echo "📁 生成されたファイル:"
            ls -la playwright-report/ || echo "playwright-reportディレクトリが存在しません"
            ls -la test-results/ || echo "test-resultsディレクトリが存在しません"
            exit 1
          }
          
          echo "✅ E2Eテスト成功: $(date)"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-chrome
          path: playwright-report/
          retention-days: 30
          
      - name: Upload Test Results  
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          
      - name: Upload Screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/**/screenshots/
          retention-days: 30

  e2e-summary:
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Comment E2E test results
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            const e2eJobs = jobs.data.jobs.filter(job => job.name.startsWith('E2E Tests'));
            const e2eJob = e2eJobs[0];
            const isSuccess = e2eJob?.conclusion === 'success';
            const status = isSuccess ? '✅' : '❌';
            
            const overallStatus = isSuccess 
              ? '✅ E2Eテストが成功しました' 
              : '❌ E2Eテストが失敗しました';

            // アーティファクト情報を追加
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            const relevantArtifacts = artifacts.data.artifacts.filter(artifact => 
              artifact.name.includes('playwright') || artifact.name.includes('screenshots')
            );
            
            let artifactLinks = '';
            if (relevantArtifacts.length > 0) {
              artifactLinks = '\n\n### 📊 利用可能なレポート・アーティファクト:\n';
              relevantArtifacts.forEach(artifact => {
                artifactLinks += `- **${artifact.name}** (${(artifact.size_in_bytes / 1024 / 1024).toFixed(2)} MB)\n`;
              });
              artifactLinks += '\n💡 アーティファクトはGitHub ActionsのSummaryページからダウンロードできます';
            }

            // PRの場合のみコメントを投稿
            if (context.issue && context.issue.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🧪 E2Eテスト結果\n\n${overallStatus}\n\n**詳細情報:**\n- ブラウザ: Chrome\n- 実行時刻: ${new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })}\n- ワーカー: 1 (CI最適化)\n- 再試行: 3回${artifactLinks}`
              });
            } else {
              console.log('This is not a pull request, skipping comment creation');
              console.log('E2E test results:', overallStatus);
              console.log('Browser: Chrome');
            }

  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy_db

      - name: Comment build status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ ビルド成功' : '❌ ビルド失敗';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 ビルド結果\n\n${status}\n\n- Node.js: 18\n- 実行時刻: ${new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })}`
            });
